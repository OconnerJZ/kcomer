name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/order-kitchen-workflow
      - feature/admin-control-center

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Admin control center lint
        run: npx eslint src/features/admin --ext js,jsx --report-unused-disable-directives --max-warnings 0

      - name: Admin navigation unit tests
        run: node --test src/features/admin/model/*.test.mjs

      - name: Quality gate
        run: npm run quality

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
