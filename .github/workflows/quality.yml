name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/order-kitchen-workflow

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint critical order workflow
        run: npm run lint:critical

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
